<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="查询致远一号的环境配置、镜像部署和使用问题。">
  <title>致远一号使用问答助手</title>
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="shell topbar-inner">
      <a class="brand" href="./" aria-label="致远一号使用问答助手首页">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span><strong>致远一号</strong><small>使用问答助手</small></span>
      </a>
      <a class="topbar-link" href="https://claw.sjtu.edu.cn/guide/sjtu-api/" target="_blank" rel="noopener noreferrer">官方指南</a>
    </div>
  </header>

  <main class="shell workspace qa-workspace">
    <section class="intro" aria-labelledby="page-title">
      <h1 id="page-title">你想了解什么？</h1>
      <p>了解致远一号的环境配置、镜像部署和使用方法。</p>
    </section>

    <section class="recommendations" aria-labelledby="suggestions-title">
      <h2 id="suggestions-title">推荐问题</h2>
      <div id="suggestions" class="suggestions"></div>
    </section>

    <section class="panel chat" aria-labelledby="chat-title">
      <header class="panel-heading">
        <h2 id="chat-title">对话</h2>
        <button type="button" id="reset" class="quiet" disabled>新会话</button>
      </header>
      <div class="chat-body" id="chat-scroll" tabindex="0" aria-label="对话记录">
        <div class="welcome" id="welcome">
          <span class="assistant-avatar" aria-hidden="true">远</span>
          <p>选择一个推荐问题，或输入你遇到的问题。</p>
        </div>
        <div id="messages" class="messages" role="log" aria-label="对话消息"></div>
        <p class="reply-status" id="reply-status" role="status" hidden>正在回答…</p>
      </div>
      <form class="composer" id="composer">
        <div class="input-row">
          <textarea id="message" aria-label="问题或脱敏报错" aria-describedby="input-help" maxlength="4000" rows="2" placeholder="输入你的问题…" disabled></textarea>
          <button id="send" class="primary" type="submit" disabled>发送</button>
        </div>
        <p id="input-help">请先移除 API Key 和账号信息。Enter 发送，Shift + Enter 换行。</p>
        <div class="error" id="error" role="alert" hidden></div>
      </form>
    </section>
  </main>
</body>
</html>
